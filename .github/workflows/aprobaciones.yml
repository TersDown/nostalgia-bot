name: Aprobaciones (Telegram)

on:
  schedule:
    # Revisa cada 10 min si tocaste ✅ / 🔁 / 🗑 en Telegram. Repositorio privado: usa "0 * * * *" (cada hora).
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: aprobaciones
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Instalar rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - run: python -m src.aprobar
      - name: Guardar estado
        if: always()
        run: bash .github/guardar_estado.sh aprobaciones
