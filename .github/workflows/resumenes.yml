name: Carpeta vigilada (resúmenes)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: resumenes
  cancel-in-progress: false

permissions:
  contents: write

env:
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  RCLONE_CONF: ${{ secrets.RCLONE_CONF }}

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      archivo: ${{ steps.buscar.outputs.archivo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Instalar rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - id: buscar
        run: python -m src.watch --revisar

  procesar:
    needs: revisar
    if: needs.revisar.outputs.archivo != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Instalar ffmpeg, fuentes y rclone
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Procesar capítulo
        env:
          ARCHIVO: ${{ needs.revisar.outputs.archivo }}
        run: python -m src.watch --procesar "$ARCHIVO"
      - name: Guardar estado
        if: always()
        run: bash .github/guardar_estado.sh videos
